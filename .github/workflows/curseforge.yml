name: Publish to CurseForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_type:
        description: CurseForge file channel
        type: choice
        options: [beta, alpha, release]
        default: beta
        required: true

permissions:
  contents: read

concurrency:
  group: curseforge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Test publisher without network or credentials
        run: python -m unittest discover -s tests -p test_curseforge.py -v
      - name: Build and validate installable archive
        run: python package.py
      - name: Retain exact upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CurseForge-upload-${{ github.run_id }}
          path: |
            dist/*-CurseForge.zip
            dist/*-CurseForge.sha256
          if-no-files-found: error
      - name: Upload verified addon
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
          CF_RELEASE_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type || (github.event.release.prerelease && 'beta' || 'release') }}
          CF_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python publishing/upload_curseforge.py
